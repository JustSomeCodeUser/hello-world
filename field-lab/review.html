<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIELD / native visual review</title><style>body{margin:18px;background:#0c151b;color:#dbe7eb;font:12px/1.6 system-ui}h1{font-weight:500;font-size:22px;margin:0}p{margin:4px 0;color:#a6bdc5}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}article{background:#152630;padding:8px}article h2{font-size:12px;margin:0 0 4px;font-weight:500}.pair{display:flex;gap:3px}.pair>div{width:50%}img{width:100%;height:auto;display:block}small{font-size:9px;color:#b9cbd2}pre{white-space:pre-wrap;font:10px/1.4 monospace}a{color:#97d6df}button{background:#8bc1cc;color:#10212b;border:0;padding:10px;margin:8px 8px 0 0}canvas{display:none}summary{cursor:pointer;color:#b9d9e3}#status{color:#ebc394}@media(max-width:600px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><h1>FIELD / 原生 GPU 画面对照</h1><p>每项左 Lite / 右 Stateful。同一参考背景、360×640 像素、固定推进 4 秒。不是录像或手机性能。</p><p><a href="?group=0">01–08</a> · <a href="?group=1">09–16</a> · <a href="?group=2">17–22</a> · <a href="?group=all">全部</a> · <a href="?group=all&gl1=1">WebGL1 功能验证</a> · <a href="index.html">返回交互实验台</a></p><p id="device"></p><p id="status">开始构建…</p><canvas id="c" width="360" height="640"></canvas><div id="grid"></div><button id="export">导出画面与验证 JSON</button><details><summary>验证结果 JSON</summary><pre id="results"></pre></details><script src="catalog.js"></script><script src="shaders.js"></script><script src="engine.js"></script><script>
'use strict';
(async()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),e=new FXEngine($('c'),q.has('gl1')),group=q.get('group')||'0',effects=group==='all'?EFFECTS:EFFECTS.slice(+group*8,+group*8+8),results=[],images=[];const sleep=()=>new Promise(r=>setTimeout(r,0));$('device').textContent=JSON.stringify(e.device);window.REVIEW={engine:e,results,images};for(const def of effects){let card=document.createElement('article');card.innerHTML='<h2>'+def.no+' '+def.name+'</h2><div class="pair"></div>';$('grid').append(card);for(const route of ['lite','stateful']){let row={id:def.id,route},div=document.createElement('div');div.innerHTML='<small>'+route+'</small>';card.querySelector('.pair').append(div);try{e.configure(def.id,route);for(let j=0;j<8;j++){for(let i=0;i<30;i++){e.advance(1/60);if(e.trail)e.render()}await sleep()}e.render();e.gl.finish();let img=document.createElement('img');img.src=e.canvas.toDataURL();div.append(img);images.push({id:def.id,route,dataURL:img.src});row.glError=e.gl.getError();row.info=e.info();const g=e.gl;let target=e.fluid?.dye.a||e.wave?.a;if(target){g.bindFramebuffer(g.FRAMEBUFFER,target.fb);const a=target.isFloat?new Float32Array(target.w*target.h*4):new Uint8Array(target.w*target.h*4);g.readPixels(0,0,target.w,target.h,g.RGBA,target.isFloat?g.FLOAT:g.UNSIGNED_BYTE,a);row.readbackError=g.getError();row.nonfinite=0;row.max=-Infinity;row.min=Infinity;for(const x of a){if(!Number.isFinite(x))row.nonfinite++;row.max=Math.max(row.max,x);row.min=Math.min(row.min,x)}}row.status=row.glError||row.readbackError||row.nonfinite?'check-failed':'pass';}catch(err){row.status=q.has('gl1')&&route==='stateful'&&def.engine==='fluid'?'expected-unsupported':'failed';row.error=String(err);div.append(document.createTextNode(row.status));}results.push(row);$('status').textContent='已完成 '+results.length+' / '+effects.length*2;$('results').textContent=JSON.stringify({device:e.device,results},null,2);await sleep()}}
$('status').textContent='完成 '+results.length+' 项路线；技术通过 ≠ 商业美术验收。';window.REVIEW_DONE=true;$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({device:e.device,results,images})],{type:'application/json'}));a.href=u;a.download='field-visual-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
})();
</script></html>
