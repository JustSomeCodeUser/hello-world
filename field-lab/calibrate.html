<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIELD / Batch calibration</title><style>body{margin:24px auto;padding:0 18px;max-width:1100px;background:#0c151b;color:#d8e7eb;font:14px/1.65 system-ui}canvas{width:180px;height:320px;float:right;margin:0 0 20px 24px}button{background:#9bc7cf;color:#10212b;padding:12px;border:0;margin:5px;cursor:pointer}pre{font:10px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:24px}small{color:#94aab4}main{clear:both}</style><header><canvas id="c" width="360" height="640"></canvas><h1>FIELD / 连续批量校准</h1><p>将 60 个固定时间步的完整更新＋绘制放进一个 GPU 计时区间，连续测 5 批。用于摊薄计时和调度噪声，不是手机 FPS，也不代表游戏整帧。</p><p>预热与 gl.finish 排空发生在计时之外；每批更新 1/60 秒，流体保持 30 Hz。CPU 和 GPU 分别记录，不能相加。每次结果包含五批独立归一化样本。</p><button id="run">开始全矩阵＋四层校准</button><button id="export">导出完整 JSON</button><button id="stop">停止</button><p id="status">等待</p><p id="device"></p></header><main><h2 id="count">0 个案例</h2><pre id="csv"></pre></main><script src="catalog.js"></script><script src="shaders.js"></script><script src="engine.js"></script><script>
'use strict';
const $=x=>document.getElementById(x),q=new URLSearchParams(window.__testQuery||location.search),e=new FXEngine($('c'),q.get('webgl')==='1'),g=e.gl,ext=e.timer;let running=false,stop=false,rows=[],queue=[],errors=[];const N=+(q.get('batch')||60),REPS=+(q.get('reps')||5),median=a=>[...a].sort((x,y)=>x-y)[Math.floor(a.length/2)],round=x=>x==null?null:+x.toFixed(6),sleep=()=>new Promise(r=>requestAnimationFrame(r));
$('device').textContent=JSON.stringify(e.device);
function output(){const head=['case','effect','route','pixels','layers','status','gpu_median_ms','gpu_min_ms','gpu_max_ms','cpu_median_ms','draws_per_frame','updates_per_frame','texture_bytes'];for(let k=1;k<=REPS;k++)head.push('gpu_b'+k);for(let k=1;k<=REPS;k++)head.push('cpu_b'+k);let lines=[head.join(',')];for(let r of rows){const good=r.batches.filter(x=>x.gpuMs!=null),gpu=good.map(x=>x.gpuMs),cpu=r.batches.map(x=>x.cpuMs);lines.push([r.case,r.effect,r.route,r.pixels,r.layers,r.status,gpu.length?round(median(gpu)):'',gpu.length?round(Math.min(...gpu)):'',gpu.length?round(Math.max(...gpu)):'',cpu.length?round(median(cpu)):'',r.batches[0]?.drawsPerFrame??'',r.batches[0]?.updatesPerFrame??'',r.memory,...r.batches.map(x=>x.gpuMs??''),...r.batches.map(x=>x.cpuMs)].join(','));}$('csv').textContent=lines.join('\n');$('count').textContent=rows.length+' 个案例';}
async function batch(){g.finish();let query=null;if(ext){query=e.gl2?g.createQuery():ext.createQueryEXT();if(e.gl2)g.beginQuery(ext.TIME_ELAPSED_EXT,query);else ext.beginQueryEXT(ext.TIME_ELAPSED_EXT,query);}e.drawCalls=0;const step0=e.simSteps,start=performance.now();for(let i=0;i<N;i++){e.advance(1/60);e.render();}const cpu=(performance.now()-start)/N;if(query){if(e.gl2)g.endQuery(ext.TIME_ELAPSED_EXT);else ext.endQueryEXT(ext.TIME_ELAPSED_EXT);}g.flush();let gpu=null,disjoint=false;const until=performance.now()+15000;if(query){for(;;){await sleep();if(g.getParameter(ext.GPU_DISJOINT_EXT)){disjoint=true;break;}let ready=e.gl2?g.getQueryParameter(query,g.QUERY_RESULT_AVAILABLE):ext.getQueryObjectEXT(query,ext.QUERY_RESULT_AVAILABLE_EXT);if(ready){const ns=e.gl2?g.getQueryParameter(query,g.QUERY_RESULT):ext.getQueryObjectEXT(query,ext.QUERY_RESULT_EXT);gpu=ns/1e6/N;break;}if(performance.now()>until){errors.push('timer timeout');break;}}if(e.gl2)g.deleteQuery(query);else ext.deleteQueryEXT(query);}else await sleep();return{gpuMs:round(gpu),cpuMs:round(cpu),disjoint,drawsPerFrame:e.drawCalls/N,updatesPerFrame:(e.simSteps-step0)/N};}
async function run(){if(running)return;running=true;stop=false;rows=[];queue=[];errors=[];$('run').disabled=true;window.CAL_DONE=false;const ids=q.has('only')?q.get('only').split(','):EFFECTS.map(x=>x.id);const sizes=q.has('single')?[[360,640]]:[[360,640],[720,1280]];for(let [w,h]of sizes){queue.push({id:'baseline',route:'lite',w,h,layers:1});for(let id of ids)for(let route of ['lite','stateful'])queue.push({id,route,w,h,layers:1});}if(!q.has('nooverdraw'))for(let id of ids)for(let route of ['lite','stateful'])queue.push({id,route,w:360,h:640,layers:4});let total=queue.length;
while(queue.length&&!stop){if(document.hidden){errors.push('hidden');stop=true;break;}let c=queue.shift();let r={case:rows.length,effect:c.id,route:c.route,pixels:c.w+'x'+c.h,layers:c.layers,status:'ok',batches:[],memory:0};try{e.canvas.width=c.w;e.canvas.height=c.h;e.layers=c.layers;e.configure(c.id,c.route);r.memory=e.memoryBytes;for(let i=0;i<90;i++){e.advance(1/60);e.render();}g.finish();for(let k=0;k<REPS&&!stop;k++){$('status').textContent=`${r.case+1}/${total} · ${c.id} ${c.route} ${r.pixels} ×${c.layers} · 批次 ${k+1}/${REPS}`;await sleep();if(document.hidden){stop=true;errors.push('hidden');break;}r.batches.push(await batch());}const err=g.getError();if(err){r.status='gl-error';r.glError=err;}if(r.batches.some(b=>b.disjoint))r.status='disjoint';if(r.batches.length!==REPS)r.status='incomplete';}catch(error){r.status='unsupported';r.error=String(error);}rows.push(r);output();}
running=false;$('run').disabled=false;$('status').textContent=stop?'停止，结果不完整':'完成：比较均摊 GPU 成本与 CPU 提交成本；不要直接外推为手机 FPS。';window.CAL_DONE=true;}
function report(){return{schema:'field-batch-calibration/1',createdAt:new Date().toISOString(),device:e.device,batchFrames:N,batchesPerCase:REPS,fixedDt:1/60,fluidHz:30,notes:['All shader preparation and the preceding GPU drain are outside the query. Each measured batch contains complete advances and rendering, not a stripped substitute shader.','This is an off-vsync throughput microbenchmark, not a sustained mobile FPS or full-game budget. Includes GL scheduling/command supply inside the interval.','Four-layer cases share one state; they are not four independent fluid simulations.','Reference scene texture is precomputed; game framebuffer capture is excluded.'],complete:!running&&!stop,errors,rows};}
$('run').onclick=run;$('stop').onclick=()=>{stop=true};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='field-calibration-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};window.CAL={run,report,engine:e};e.render();if(q.has('autorun'))setTimeout(run,500);
</script></html>
